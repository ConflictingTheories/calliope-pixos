<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SpritzCut Demo — Fixed Layout & Speed</title>
    <style>
        :root {
            --bg: #041021;
            --panel: #071426;
            --accent: #7dd3fc;
            --text: #e6eef8
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
            background: linear-gradient(180deg, #03101a, #041021);
            color: var(--text)
        }

        .container {
            max-width: 1200px;
            margin: 24px auto;
            display: flex;
            gap: 18px;
            align-items: flex-start;
            padding: 12px
        }

        /* Stage - fixed size box where cutscene plays */
        .stage {
            width: 960px;
            height: 540px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            background: #071021;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
            flex: 0 0 auto
        }

        .backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity .35s ease;
            background-repeat: no-repeat
        }

        .backdrop.hidden {
            opacity: 0
        }

        /* world placeholder */
        .world {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none
        }

        .platform {
            width: 60%;
            height: 200px;
            background: linear-gradient(180deg, #092032, #071427);
            opacity: .65;
            border-radius: 6px;
            margin-bottom: 70px
        }

        /* HUD elements */
        .portrait {
            position: absolute;
            left: 18px;
            bottom: 110px;
            width: 160px;
            height: 160px;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(180deg, #081827, #05101a);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
            transition: transform .25s, opacity .25s, z-index .1s
        }

        .portrait.hidden {
            opacity: 0;
            transform: translateY(10px)
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .cutin {
            position: absolute;
            left: 6%;
            top: 6%;
            width: 88%;
            height: 62%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity .3s, transform .35s
        }

        .cutin.show {
            opacity: 1;
            transform: none
        }

        .cutin .card {
            width: 72%;
            height: 86%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, .5)
        }

        .dialogueBox {
            position: absolute;
            left: 200px;
            right: 20px;
            bottom: 28px;
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(2, 6, 11, 0.95), rgba(3, 7, 13, 0.95));
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .5)
        }

        .speaker {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px
        }

        .text {
            white-space: pre-wrap;
            line-height: 1.38;
            font-size: 16px;
            color: var(--text);
            min-height: 46px
        }

        /* Controls under the dialogue box inside stage */
        .stageControls {
            position: absolute;
            right: 18px;
            bottom: 14px;
            display: flex;
            gap: 8px
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer
        }

        /* Editor panel placed to the right of the stage, not overlapping */
        .editorPanel {
            width: 360px;
            background: linear-gradient(180deg, rgba(6, 10, 16, 0.72), rgba(4, 8, 14, 0.72));
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
            flex: 0 0 360px
        }

        .editorPanel h4 {
            margin: 0 0 8px 0;
            color: var(--accent);
            font-size: 14px
        }

        textarea {
            width: 100%;
            height: 340px;
            background: #021423;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical
        }

        .panelRow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px
        }

        label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85)
        }

        input[type=range] {
            flex: 1
        }

        .speedVal {
            width: 44px;
            text-align: right;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85)
        }

        /* responsive: stack vertically on small screens */
        @media (max-width:1200px) {
            .container {
                flex-direction: column;
                align-items: center
            }

            .editorPanel {
                width: 92%;
                margin-top: 12px
            }

            .stage {
                width: 92%;
                height: 480px
            }

            .dialogueBox {
                left: 18px;
                right: 18px
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="stage" id="stage">
            <div id="backdrop" class="backdrop hidden"></div>
            <div class="world">
                <div class="platform"></div>
            </div>

            <div id="cutin" class="cutin">
                <div id="cutinCard" class="card">CUT-IN</div>
            </div>
            <div id="portrait" class="portrait hidden"><img id="portraitImg" alt="portrait"></div>

            <div class="dialogueBox">
                <div id="speaker" class="speaker">—</div>
                <div id="dialogueText" class="text">(press Play)</div>
                <div class="stageControls">
                    <button id="playBtn" class="btn">Play</button>
                    <button id="stopBtn" class="btn">Stop</button>
                    <button id="skipBtn" class="btn">Skip</button>
                </div>
            </div>
        </div>

        <div class="editorPanel">
            <h4>SpritzCut DSL — Editor</h4>
            <textarea id="scriptArea"># Working, cleaner layout demo
@backdrop data:harbor [fadeIn=300]
@char ALDEN sprite=data:alden
@char LIRA sprite=data:lira

ALDEN: [expression=smile] Evening, Lira.
LIRA: [expression=annoyed] I had to deal with bureaucracy.

ALDEN:
"""
We can't afford mistakes now.
We sail at dawn.
"""

*LIRA: [cutin=size=large] You'd better be right.

@action ALDEN moveTo [x=40,duration=500] -> @do playSfx [name=seagull] | @transition fadeOutBackdrop [duration=500]

waitInput

@transition wipe [duration=420]
@end
</textarea>

            <div class="panelRow">
                <label for="speedRange">Speed (ms / char)</label>
                <input id="speedRange" type="range" min="8" max="200" value="60">
                <div class="speedVal" id="speedVal">60</div>
            </div>

            <div class="panelRow" style="margin-top:10px;justify-content:space-between">
                <div style="font-size:13px;color:rgba(255,255,255,0.82)">Auto-advance:</div>
                <div>
                    <label style="font-size:13px;color:rgba(255,255,255,0.9);margin-right:8px"><input id="autoAdvance"
                            type="checkbox"> Enable</label>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Robust demo parser + player (improved layout and speed control)
        (function () {
            function parseBracket(s) { const out = {}; if (!s) return out; s = s.trim(); if (!s.startsWith('[')) return out; s = s.slice(1, -1).trim(); if (!s) return out; const parts = s.split(',').map(p => p.trim()).filter(Boolean); parts.forEach(p => { if (p.includes('=')) { const [k, v] = p.split(/=(.+)/); const val = v.replace(/^"|"$/g, '').trim(); if (/^\d+$/.test(val)) out[k] = parseInt(val, 10); else if (/^\d+\.\d+$/.test(val)) out[k] = parseFloat(val); else if (val === 'true' || val === 'false') out[k] = (val === 'true'); else out[k] = val } else out[p] = true }); return out }

            function parseScript(text) {
                const lines = text.replace(/\r\n/g, '\n').split('\n'); const scene = { meta: {}, chars: {}, resources: [], events: [] }; let i = 0;
                while (i < lines.length) {
                    let raw = lines[i].trim(); if (!raw || raw.startsWith('#')) { i++; continue }
                    const dlg = raw.match(/^(\*?)([A-Za-z0-9_]+)\s*:\s*(.*)$/);
                    if (dlg) {
                        const isCut = !!dlg[1]; const name = dlg[2]; let tail = dlg[3].trim(); let meta = {}; if (tail.startsWith('[')) { const ci = tail.indexOf(']'); if (ci !== -1) { meta = parseBracket(tail.slice(0, ci + 1)); tail = tail.slice(ci + 1).trim() } }
                        if (tail.startsWith('"""')) {
                            let content = tail.slice(3); if (content.includes('"""')) content = content.split('"""')[0]; else { i++; while (i < lines.length && !lines[i].includes('"""')) { content += lines[i] + '\n'; i++; } if (i < lines.length) content += lines[i].split('"""')[0]; }
                            scene.events.push({ type: isCut ? 'cutin' : 'dialogue', actor: name, payload: { text: content.trim(), meta }, blocking: true }); i++; continue
                        }
                        if (lines[i + 1] && lines[i + 1].trim().startsWith('"""')) {
                            i++; let content = ''; if (lines[i].trim().startsWith('"""')) { let rest = lines[i].replace(/.*?"""/, ''); if (rest.includes('"""')) content = rest.split('"""')[0]; else { i++; while (i < lines.length && !lines[i].includes('"""')) { content += lines[i] + '\n'; i++; } if (i < lines.length) content += lines[i].split('"""')[0]; } }
                            scene.events.push({ type: isCut ? 'cutin' : 'dialogue', actor: name, payload: { text: content.trim(), meta }, blocking: true }); i++; continue
                        }
                        scene.events.push({ type: isCut ? 'cutin' : 'dialogue', actor: name, payload: { text: tail, meta }, blocking: true }); i++; continue
                    }

                    if (raw.startsWith('@')) {
                        const m = raw.match(/^@([a-zA-Z_]+)\s*(.*)$/); if (!m) { i++; continue } const cmd = m[1]; let rest = m[2].trim(); let bracket = null; const br = rest.match(/\[[^\]]*\]$/); if (br) { bracket = parseBracket(br[0]); rest = rest.slice(0, rest.length - br[0].length).trim() }
                        if (cmd === 'backdrop') { scene.resources.push(rest || bracket.file || ''); scene.events.push({ type: 'backdrop', payload: { file: rest || bracket.file || '', options: bracket || {} }, blocking: !!(bracket && bracket.blocking) }); }
                        else if (cmd === 'char') { const parts = rest.split(/\s+/); const name = parts[0]; const attrs = {}; parts.slice(1).forEach(p => { if (p.includes('=')) { const [k, v] = p.split(/=(.+)/); attrs[k] = v.replace(/^"|"$/g, ''); } }); Object.assign(attrs, bracket || {}); scene.chars[name] = attrs; if (attrs.sprite) scene.resources.push(attrs.sprite); }
                        else if (cmd === 'action') { const parts = rest.match(/(?:[^\s\[]+|\[[^\]]*\])/g) || []; const name = parts[0]; const verb = parts[1]; const args = parseBracket(parts.slice(2).join(' ') || ''); scene.events.push({ type: 'action', actor: name, payload: { verb, args }, blocking: !!args.blocking }); }
                        else if (cmd === 'do') { const parts = rest.match(/(?:[^\s\[]+|\[[^\]]*\])/g) || []; const hook = parts[0]; const args = parseBracket(parts.slice(1).join(' ') || ''); scene.events.push({ type: 'hook', payload: { hook, args }, blocking: !!args.blocking }); if (args.name) scene.resources.push(args.name); }
                        else if (cmd === 'transition') { const name = rest.split(/\s+/)[0] || ''; scene.events.push({ type: 'transition', payload: { name, params: bracket || {} }, blocking: !(bracket && bracket.nonblocking) }); }
                        else if (cmd === 'end') { scene.events.push({ type: 'end', payload: {}, blocking: false }); }
                        i++; continue
                    }

                    if (raw.startsWith('waitInput')) { scene.events.push({ type: 'waitInput', payload: {}, blocking: true }); i++; continue }
                    if (raw.startsWith('wait ')) { const mm = raw.match(/^wait\s+(\d+)/); if (mm) scene.events.push({ type: 'wait', payload: { ms: parseInt(mm[1], 10) }, blocking: true }); i++; continue }

                    scene.events.push({ type: 'raw', payload: { text: raw }, blocking: false }); i++;
                }
                return scene
            }

            // Player factory
            function createPlayer(getSpeed, autoAdvanceGetter) {
                return {
                    scene: null, resources: {}, stopped: false, getSpeed, autoAdvanceGetter,
                    async play(text) {
                        this.stopped = false; this.scene = parseScript(text); this._preload(); for (const ev of this.scene.events) { if (this.stopped) break; await this._handle(ev); }
                    },
                    stop() { this.stopped = true },
                    _preload() { this.resources = {}; this.resources['data:harbor'] = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="#08202a"/><text x="50%" y="80%" font-size="64" fill="#aee6ff" text-anchor="middle">HARBOR</text></svg>'); this.resources['data:alden'] = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" fill="#112430"/><text x="50%" y="50%" font-size="72" fill="#7dd3fc" text-anchor="middle">ALDEN</text></svg>'); this.resources['data:lira'] = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" fill="#0b2130"/><text x="50%" y="50%" font-size="72" fill="#ffd6a5" text-anchor="middle">LIRA</text></svg>'); },

                    _handle(ev) { if (ev.type === 'backdrop') return this._showBackdrop(ev); if (ev.type === 'dialogue' || ev.type === 'cutin') return this._showDialogue(ev); if (ev.type === 'action') return this._doAction(ev); if (ev.type === 'hook') return this._doHook(ev); if (ev.type === 'transition') return this._doTransition(ev); if (ev.type === 'waitInput') return this._waitInput(); if (ev.type === 'wait') return new Promise(r => setTimeout(r, ev.payload.ms || 200)); return Promise.resolve(); },

                    _showBackdrop(ev) { return new Promise(res => { const el = document.getElementById('backdrop'); const f = ev.payload.file; const url = this.resources[f] || f; el.style.backgroundImage = `url(${url})`; el.classList.remove('hidden'); if (ev.payload.options && ev.payload.options.fadeIn) { el.style.transition = `opacity ${ev.payload.options.fadeIn}ms ease`; el.style.opacity = '1'; setTimeout(res, ev.payload.options.fadeIn); } else res(); }); },

                    _showDialogue(ev) {
                        return new Promise(resolve => {
                            const name = ev.actor; const text = ev.payload.text || ''; const sprite = (ev.payload.meta && ev.payload.meta.sprite) || (this.scene.chars[name] && this.scene.chars[name].sprite) || ('data:' + name.toLowerCase()); const img = this.resources[sprite] || sprite;
                            if (ev.type === 'dialogue') { document.getElementById('portraitImg').src = img; document.getElementById('portrait').classList.remove('hidden'); document.getElementById('cutin').classList.remove('show'); }
                            else { document.getElementById('cutinCard').style.backgroundImage = `url(${img})`; document.getElementById('cutin').classList.add('show'); }
                            document.getElementById('speaker').textContent = name;

                            const txtEl = document.getElementById('dialogueText'); txtEl.textContent = ''; let i = 0;
                            const step = () => {
                                if (this.stopped) { resolve(); return; }
                                if (i < text.length) { txtEl.textContent += text[i++]; let base = (typeof this.getSpeed === 'function' ? this.getSpeed() : 60); let delay = base; if (/[.,!?]/.test(text[i - 1])) delay += Math.round(base * 1.2); setTimeout(step, delay); }
                                else {
                                    // auto advance support
                                    if (this.autoAdvanceGetter && this.autoAdvanceGetter()) {
                                        setTimeout(() => resolve(), 400);
                                    } else resolve();
                                }
                            };
                            step();
                        });
                    },

                    _doAction(ev) { return new Promise(res => { const v = ev.payload; if (v.verb === 'moveTo') { const el = document.getElementById('portrait'); el.style.transition = `transform ${(v.args.duration || 300)}ms ease`; el.style.transform = `translateX(${(v.args.x || 0) / 6}px)`; setTimeout(() => { el.style.transform = 'none'; res(); }, v.args.duration || 300); } else res(); }); },
                    _doHook(ev) { if (ev.payload.hook === 'playSfx') { const bd = document.getElementById('backdrop'); bd.style.filter = 'brightness(1.12)'; setTimeout(() => bd.style.filter = 'none', 140); } return Promise.resolve(); },
                    _doTransition(ev) {
                        return new Promise(res => {
                            const name = ev.payload.name; const params = ev.payload.params || {};
                            if (name === 'fadeOutBackdrop') { const d = params.duration || 300; const el = document.getElementById('backdrop'); el.style.transition = `opacity ${d}ms ease`; el.style.opacity = '0'; setTimeout(() => { el.classList.add('hidden'); el.style.opacity = '1'; res(); }, d); }
                            else if (name === 'wipe') { document.getElementById('cutin').classList.remove('show'); document.getElementById('portrait').classList.add('hidden'); setTimeout(res, params.duration || 300); }
                            else res();
                        });
                    },
                    _waitInput() { return new Promise(res => { const done = () => { window.removeEventListener('pointerdown', done); window.removeEventListener('keydown', done); res(); }; window.addEventListener('pointerdown', done); window.addEventListener('keydown', done); }); }
                }
            }

            // wire UI
            const playBtn = document.getElementById('playBtn'); const stopBtn = document.getElementById('stopBtn'); const skipBtn = document.getElementById('skipBtn'); const area = document.getElementById('scriptArea'); const speedRange = document.getElementById('speedRange'); const speedVal = document.getElementById('speedVal'); const autoAdvanceEl = document.getElementById('autoAdvance');

            const player = createPlayer(() => parseInt(speedRange.value, 10), () => !!autoAdvanceEl.checked);

            // speed UI
            speedVal.textContent = speedRange.value; speedRange.addEventListener('input', () => { speedVal.textContent = speedRange.value; });

            playBtn.addEventListener('click', () => { player.stop(); document.getElementById('backdrop').classList.add('hidden'); document.getElementById('portrait').classList.add('hidden'); document.getElementById('cutin').classList.remove('show'); document.getElementById('speaker').textContent = ''; document.getElementById('dialogueText').textContent = ''; player.play(area.value).catch(e => console.error(e)); });
            stopBtn.addEventListener('click', () => { player.stop(); });
            skipBtn.addEventListener('click', () => { player.stop(); document.getElementById('speaker').textContent = '(skipped)'; document.getElementById('dialogueText').textContent = ''; document.getElementById('portrait').classList.add('hidden'); document.getElementById('cutin').classList.remove('show'); document.getElementById('backdrop').classList.add('hidden'); });

        })();
    </script>
</body>

</html>
