<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Map Editor - WebGL 2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #sidebar {
            width: 320px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            overflow-y: auto;
            padding: 10px;
        }
        
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #toolbar {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            background: #1e1e1e;
        }
        
        #glCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .section {
            margin-bottom: 20px;
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .section-header {
            background: #37373d;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-header:hover {
            background: #3e3e42;
        }
        
        .section-content {
            padding: 10px;
        }
        
        .section-content.collapsed {
            display: none;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:active {
            background: #0d5a8f;
        }
        
        button.secondary {
            background: #3e3e42;
        }
        
        button.secondary:hover {
            background: #4e4e52;
        }
        
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 13px;
            width: 100%;
        }
        
        input[type="file"] {
            color: #d4d4d4;
            font-size: 13px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #cccccc;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tile-item {
            background: #3c3c3c;
            border: 2px solid #3e3e42;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
            word-wrap: break-word;
        }
        
        .tile-item:hover {
            border-color: #0e639c;
        }
        
        .tile-item.selected {
            border-color: #1177bb;
            background: #0e639c;
        }
        
        .info-text {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        
        .status-bar {
            background: #007acc;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
        }
        
        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .texture-preview {
            width: 100%;
            height: 200px;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .texture-preview canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        #cellEditor {
            position: absolute;
            background: #2d2d30;
            border: 1px solid #3e3e42;
            padding: 15px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        .geometry-editor {
            background: #3c3c3c;
            padding: 10px;
            border-radius: 3px;
            margin-top: 10px;
        }
        
        .geometry-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .geometry-item {
            background: #2d2d30;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .geometry-item:hover {
            background: #37373d;
        }
        
        .btn-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        
        .btn-group button {
            flex: 1;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }
        
        .tool-active {
            background: #1177bb !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>📁 Load Files</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div class="form-group">
                        <label>Map JSON:</label>
                        <input type="file" id="mapFile" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>Cells JSON:</label>
                        <input type="file" id="cellsFile" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>Tileset JSON:</label>
                        <input type="file" id="tilesetFile" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>Tiles JSON:</label>
                        <input type="file" id="tilesFile" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>Geometry JSON:</label>
                        <input type="file" id="geometryFile" accept=".json">
                    </div>
                    <div class="form-group">
                        <label>Texture Atlas:</label>
                        <input type="file" id="textureFile" accept="image/*">
                    </div>
                    <button onclick="loadAllFiles()">Load All</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>🎨 Tiles</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div class="tile-grid" id="tileList"></div>
                    <div class="btn-group">
                        <button onclick="showAddTileDialog()">Add Tile</button>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>📐 Geometry</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div class="geometry-list" id="geometryList"></div>
                    <div class="btn-group">
                        <button onclick="showAddGeometryDialog()">Add Geometry</button>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>🖼️ Textures</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div id="textureList"></div>
                    <div class="texture-preview">
                        <canvas id="texturePreview"></canvas>
                    </div>
                    <div class="btn-group">
                        <button onclick="showAddTextureDialog()">Add Texture</button>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>⚙️ Map Settings</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div class="form-group">
                        <label>Map Width:</label>
                        <input type="number" id="mapWidth" value="17" min="1">
                    </div>
                    <div class="form-group">
                        <label>Map Height:</label>
                        <input type="number" id="mapHeight" value="19" min="1">
                    </div>
                    <div class="btn-group">
                        <button onclick="resizeMap()">Resize Map</button>
                        <button onclick="clearMap()">Clear</button>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    <span>💾 Export</span>
                    <span>▼</span>
                </div>
                <div class="section-content">
                    <div class="btn-group">
                        <button onclick="exportMap()">Map</button>
                        <button onclick="exportCells()">Cells</button>
                    </div>
                    <div class="btn-group">
                        <button onclick="exportTileset()">Tileset</button>
                        <button onclick="exportTiles()">Tiles</button>
                    </div>
                    <div class="btn-group">
                        <button onclick="exportGeometry()">Geometry</button>
                        <button onclick="exportAll()">All</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="main-content">
            <div id="toolbar">
                <button id="toolPaint" class="tool-active" onclick="selectTool('paint')">🖌️ Paint</button>
                <button id="toolErase" onclick="selectTool('erase')">🧹 Erase</button>
                <button id="toolPick" onclick="selectTool('pick')">🔍 Pick</button>
                <button class="secondary" onclick="resetCamera()">📷 Reset Camera</button>
                <button class="secondary" onclick="toggleGrid()">⊞ Grid</button>
                <label style="margin-left: auto; margin-bottom: 0;">
                    <input type="checkbox" id="show3D" onchange="toggle3DView()" checked> 3D View
                </label>
            </div>
            <div id="canvas-container">
                <canvas id="glCanvas"></canvas>
            </div>
            <div class="status-bar" id="statusBar">Ready</div>
        </div>
    </div>
    
    <div id="cellEditor">
        <h3 style="margin-bottom: 10px;">Edit Cell</h3>
        <div class="form-group">
            <label>Tile Type:</label>
            <select id="cellTileType"></select>
        </div>
        <div class="btn-group">
            <button onclick="applyCellEdit()">Apply</button>
            <button class="secondary" onclick="closeCellEditor()">Cancel</button>
        </div>
    </div>

    <script>
        // ============================================
        // Global State
        // ============================================
        const state = {
            map: null,
            cells: [],
            tileset: null,
            tiles: {},
            geometry: {},
            texture: null,
            textureImage: null,
            selectedTile: 'FLOOR',
            currentTool: 'paint',
            showGrid: true,
            show3D: true,
            editingCell: null
        };

        // ============================================
        // WebGL 2.0 Setup
        // ============================================
        let gl, canvas;
        let shaderProgram;
        let camera = {
            position: [8, 15, 20],
            rotation: [-0.5, 0, 0],
            zoom: 1.0
        };
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        const vertexShaderSource = `#version 300 es
            precision highp float;
            
            in vec3 aPosition;
            in vec2 aTexCoord;
            in vec3 aNormal;
            
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            
            out vec2 vTexCoord;
            out vec3 vNormal;
            out vec3 vPosition;
            
            void main() {
                gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
                vTexCoord = aTexCoord;
                vNormal = aNormal;
                vPosition = aPosition;
            }
        `;
        
        const fragmentShaderSource = `#version 300 es
            precision highp float;
            
            in vec2 vTexCoord;
            in vec3 vNormal;
            in vec3 vPosition;
            
            uniform sampler2D uTexture;
            uniform bool uUseTexture;
            uniform vec3 uColor;
            uniform bool uShowGrid;
            
            out vec4 fragColor;
            
            void main() {
                vec4 color;
                
                if (uUseTexture) {
                    color = texture(uTexture, vTexCoord);
                    if (color.a < 0.1) discard;
                } else {
                    color = vec4(uColor, 1.0);
                }
                
                // Simple lighting
                vec3 lightDir = normalize(vec3(1.0, 2.0, 3.0));
                float diff = max(dot(normalize(vNormal), lightDir), 0.3);
                color.rgb *= diff;
                
                // Grid lines
                if (uShowGrid) {
                    vec2 grid = fract(vPosition.xy);
                    if (grid.x < 0.02 || grid.x > 0.98 || grid.y < 0.02 || grid.y > 0.98) {
                        color.rgb = mix(color.rgb, vec3(0.0), 0.3);
                    }
                }
                
                fragColor = color;
            }
        `;

        function initWebGL() {
            canvas = document.getElementById('glCanvas');
            gl = canvas.getContext('webgl2', {
                antialias: true,
                alpha: false
            });
            
            if (!gl) {
                alert('WebGL 2.0 not supported!');
                return;
            }
            
            // Compile shaders
            const vertexShader = compileShader(gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
            
            // Link program
            shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, vertexShader);
            gl.attachShader(shaderProgram, fragmentShader);
            gl.linkProgram(shaderProgram);
            
            if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
                console.error('Shader program failed to link:', gl.getProgramInfoLog(shaderProgram));
                return;
            }
            
            // Enable depth testing
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            
            // Set up event listeners
            setupEventListeners();
            
            // Start render loop
            resizeCanvas();
            render();
        }

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);

        // ============================================
        // Matrix Math
        // ============================================
        function createMat4() {
            return new Float32Array(16);
        }

        function identity(out) {
            out[0] = 1; out[1] = 0; out[2] = 0; out[3] = 0;
            out[4] = 0; out[5] = 1; out[6] = 0; out[7] = 0;
            out[8] = 0; out[9] = 0; out[10] = 1; out[11] = 0;
            out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
            return out;
        }

        function perspective(out, fovy, aspect, near, far) {
            const f = 1.0 / Math.tan(fovy / 2);
            out[0] = f / aspect;
            out[1] = 0;
            out[2] = 0;
            out[3] = 0;
            out[4] = 0;
            out[5] = f;
            out[6] = 0;
            out[7] = 0;
            out[8] = 0;
            out[9] = 0;
            out[10] = (far + near) / (near - far);
            out[11] = -1;
            out[12] = 0;
            out[13] = 0;
            out[14] = (2 * far * near) / (near - far);
            out[15] = 0;
            return out;
        }

        function lookAt(out, eye, center, up) {
            const eyex = eye[0], eyey = eye[1], eyez = eye[2];
            const upx = up[0], upy = up[1], upz = up[2];
            const centerx = center[0], centery = center[1], centerz = center[2];
            
            let z0 = eyex - centerx;
            let z1 = eyey - centery;
            let z2 = eyez - centerz;
            
            let len = 1 / Math.sqrt(z0 * z0 + z1 * z1 + z2 * z2);
            z0 *= len;
            z1 *= len;
            z2 *= len;
            
            let x0 = upy * z2 - upz * z1;
            let x1 = upz * z0 - upx * z2;
            let x2 = upx * z1 - upy * z0;
            len = Math.sqrt(x0 * x0 + x1 * x1 + x2 * x2);
            if (!len) {
                x0 = 0;
                x1 = 0;
                x2 = 0;
            } else {
                len = 1 / len;
                x0 *= len;
                x1 *= len;
                x2 *= len;
            }
            
            let y0 = z1 * x2 - z2 * x1;
            let y1 = z2 * x0 - z0 * x2;
            let y2 = z0 * x1 - z1 * x0;
            
            out[0] = x0;
            out[1] = y0;
            out[2] = z0;
            out[3] = 0;
            out[4] = x1;
            out[5] = y1;
            out[6] = z1;
            out[7] = 0;
            out[8] = x2;
            out[9] = y2;
            out[10] = z2;
            out[11] = 0;
            out[12] = -(x0 * eyex + x1 * eyey + x2 * eyez);
            out[13] = -(y0 * eyex + y1 * eyey + y2 * eyez);
            out[14] = -(z0 * eyex + z1 * eyey + z2 * eyez);
            out[15] = 1;
            
            return out;
        }

        function translate(out, a, v) {
            const x = v[0], y = v[1], z = v[2];
            
            out[0] = a[0];
            out[1] = a[1];
            out[2] = a[2];
            out[3] = a[3];
            out[4] = a[4];
            out[5] = a[5];
            out[6] = a[6];
            out[7] = a[7];
            out[8] = a[8];
            out[9] = a[9];
            out[10] = a[10];
            out[11] = a[11];
            out[12] = a[0] * x + a[4] * y + a[8] * z + a[12];
            out[13] = a[1] * x + a[5] * y + a[9] * z + a[13];
            out[14] = a[2] * x + a[6] * y + a[10] * z + a[14];
            out[15] = a[3] * x + a[7] * y + a[11] * z + a[15];
            
            return out;
        }

        // ============================================
        // Rendering
        // ============================================
        function render() {
            gl.clearColor(0.12, 0.12, 0.12, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            
            if (!state.cells || state.cells.length === 0) {
                requestAnimationFrame(render);
                return;
            }
            
            gl.useProgram(shaderProgram);
            
            // Set up projection matrix
            const projectionMatrix = createMat4();
            const aspect = canvas.width / canvas.height;
            perspective(projectionMatrix, Math.PI / 4, aspect, 0.1, 1000.0);
            
            // Set up view matrix
            const viewMatrix = createMat4();
            const cameraTarget = [state.cells[0].length / 2, state.cells.length / 2, 0];
            lookAt(viewMatrix, camera.position, cameraTarget, [0, 0, 1]);
            
            // Get uniform locations
            const uModelViewMatrix = gl.getUniformLocation(shaderProgram, 'uModelViewMatrix');
            const uProjectionMatrix = gl.getUniformLocation(shaderProgram, 'uProjectionMatrix');
            const uUseTexture = gl.getUniformLocation(shaderProgram, 'uUseTexture');
            const uColor = gl.getUniformLocation(shaderProgram, 'uColor');
            const uShowGrid = gl.getUniformLocation(shaderProgram, 'uShowGrid');
            const uTexture = gl.getUniformLocation(shaderProgram, 'uTexture');
            
            gl.uniformMatrix4fv(uProjectionMatrix, false, projectionMatrix);
            gl.uniform1i(uShowGrid, state.showGrid);
            
            // Render each cell
            for (let y = 0; y < state.cells.length; y++) {
                for (let x = 0; x < state.cells[y].length; x++) {
                    const tileType = state.cells[y][x];
                    if (!tileType || tileType === 'EMPTY') continue;
                    
                    renderTile(x, y, tileType, viewMatrix, uModelViewMatrix, uUseTexture, uColor, uTexture);
                }
            }
            
            requestAnimationFrame(render);
        }

        function renderTile(x, y, tileType, viewMatrix, uModelViewMatrix, uUseTexture, uColor, uTexture) {
            const tileData = state.tiles[tileType];
            if (!tileData) return;
            
            // Model matrix for this tile
            const modelViewMatrix = createMat4();
            identity(modelViewMatrix);
            translate(modelViewMatrix, modelViewMatrix, [x, y, 0]);
            
            // Combine with view matrix
            const combined = createMat4();
            multiplyMatrices(combined, viewMatrix, modelViewMatrix);
            gl.uniformMatrix4fv(uModelViewMatrix, false, combined);
            
            // Parse tile definition
            for (let i = 0; i < tileData.length; i += 3) {
                const geometryName = tileData[i];
                const textureName = tileData[i + 1];
                const heightOffset = tileData[i + 2] || 0;
                
                const geom = state.geometry[geometryName];
                if (!geom) continue;
                
                // Render geometry
                renderGeometry(geom, textureName, heightOffset, uUseTexture, uColor, uTexture);
            }
        }

        function renderGeometry(geom, textureName, heightOffset, uUseTexture, uColor, uTexture) {
            if (!geom.vertices || geom.vertices.length === 0) return;
            
            const vertices = [];
            const texCoords = [];
            const normals = [];
            
            for (let i = 0; i < geom.vertices.length; i++) {
                const tri = geom.vertices[i];
                const texTri = geom.surfaces && geom.surfaces[i] ? geom.surfaces[i] : [[0,0],[1,0],[1,1]];
                
                for (let j = 0; j < 3; j++) {
                    // Position with height offset
                    vertices.push(tri[j][0], tri[j][1], tri[j][2] + heightOffset);
                    
                    // Texture coordinates
                    if (textureName && state.tileset && state.tileset.textures[textureName]) {
                        const texPos = state.tileset.textures[textureName];
                        const tileSize = state.tileset.tileSize || 16;
                        const sheetSize = state.tileset.sheetSize || [512, 512];
                        
                        const u = (texPos[0] * tileSize + texTri[j][0] * tileSize) / sheetSize[0];
                        const v = (texPos[1] * tileSize + texTri[j][1] * tileSize) / sheetSize[1];
                        texCoords.push(u, v);
                    } else {
                        texCoords.push(texTri[j][0], texTri[j][1]);
                    }
                    
                    // Calculate normal
                    if (j === 0 && tri.length === 3) {
                        const v1 = [tri[1][0] - tri[0][0], tri[1][1] - tri[0][1], tri[1][2] - tri[0][2]];
                        const v2 = [tri[2][0] - tri[0][0], tri[2][1] - tri[0][1], tri[2][2] - tri[0][2]];
                        const normal = [
                            v1[1] * v2[2] - v1[2] * v2[1],
                            v1[2] * v2[0] - v1[0] * v2[2],
                            v1[0] * v2[1] - v1[1] * v2[0]
                        ];
                        const len = Math.sqrt(normal[0] * normal[0] + normal[1] * normal[1] + normal[2] * normal[2]);
                        if (len > 0) {
                            normal[0] /= len;
                            normal[1] /= len;
                            normal[2] /= len;
                        }
                        normals.push(normal[0], normal[1], normal[2]);
                        normals.push(normal[0], normal[1], normal[2]);
                        normals.push(normal[0], normal[1], normal[2]);
                    }
                }
            }
            
            // Create buffers
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
            
            const aPosition = gl.getAttribLocation(shaderProgram, 'aPosition');
            gl.enableVertexAttribArray(aPosition);
            gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
            
            const texCoordBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(texCoords), gl.STATIC_DRAW);
            
            const aTexCoord = gl.getAttribLocation(shaderProgram, 'aTexCoord');
            gl.enableVertexAttribArray(aTexCoord);
            gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 0, 0);
            
            const normalBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
            
            const aNormal = gl.getAttribLocation(shaderProgram, 'aNormal');
            gl.enableVertexAttribArray(aNormal);
            gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);
            
            // Set texture or color
            if (textureName && state.texture) {
                gl.uniform1i(uUseTexture, 1);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, state.texture);
                gl.uniform1i(uTexture, 0);
            } else {
                gl.uniform1i(uUseTexture, 0);
                gl.uniform3f(uColor, 0.5, 0.5, 0.5);
            }
            
            // Draw
            gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 3);
            
            // Cleanup
            gl.deleteBuffer(positionBuffer);
            gl.deleteBuffer(texCoordBuffer);
            gl.deleteBuffer(normalBuffer);
        }

        function multiplyMatrices(out, a, b) {
            const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
            const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
            const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
            const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
            
            let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
            out[0] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
            out[1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
            out[2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
            out[3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            
            b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
            out[4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
            out[5] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
            out[6] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
            out[7] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            
            b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
            out[8] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
            out[9] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
            out[10] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
            out[11] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            
            b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
            out[12] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
            out[13] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
            out[14] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
            out[15] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            
            return out;
        }

        // ============================================
        // Event Handlers
        // ============================================
        function setupEventListeners() {
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel);
            canvas.addEventListener('click', onCanvasClick);
        }

        function onMouseDown(e) {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            
            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;
            
            if (e.shiftKey) {
                // Pan
                camera.position[0] -= deltaX * 0.02;
                camera.position[1] += deltaY * 0.02;
            } else {
                // Rotate
                camera.rotation[1] += deltaX * 0.01;
                camera.rotation[0] += deltaY * 0.01;
                
                // Update camera position based on rotation
                const dist = Math.sqrt(
                    camera.position[0] * camera.position[0] + 
                    camera.position[1] * camera.position[1] + 
                    camera.position[2] * camera.position[2]
                );
                
                camera.position[0] = Math.sin(camera.rotation[1]) * Math.cos(camera.rotation[0]) * dist;
                camera.position[1] = Math.cos(camera.rotation[1]) * Math.cos(camera.rotation[0]) * dist;
                camera.position[2] = Math.sin(camera.rotation[0]) * dist;
            }
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function onMouseUp(e) {
            isDragging = false;
        }

        function onWheel(e) {
            e.preventDefault();
            const zoomSpeed = 0.1;
            const delta = e.deltaY > 0 ? 1 + zoomSpeed : 1 - zoomSpeed;
            
            camera.position[0] *= delta;
            camera.position[1] *= delta;
            camera.position[2] *= delta;
        }

        function onCanvasClick(e) {
            if (isDragging) return;
            
            // Get click coordinates
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Raycast to find clicked cell
            const cellCoords = screenToCell(x, y);
            if (cellCoords) {
                handleCellClick(cellCoords.x, cellCoords.y);
            }
        }

        function screenToCell(screenX, screenY) {
            // Simple projection - would need proper ray casting for accuracy
            const normX = (screenX / canvas.width) * 2 - 1;
            const normY = 1 - (screenY / canvas.height) * 2;
            
            // Approximate cell position
            const cellX = Math.floor(state.cells[0].length / 2 + normX * 10);
            const cellY = Math.floor(state.cells.length / 2 - normY * 10);
            
            if (cellX >= 0 && cellX < state.cells[0].length && 
                cellY >= 0 && cellY < state.cells.length) {
                return { x: cellX, y: cellY };
            }
            
            return null;
        }

        function handleCellClick(x, y) {
            if (state.currentTool === 'paint') {
                state.cells[y][x] = state.selectedTile;
                updateStatus(`Painted ${state.selectedTile} at (${x}, ${y})`);
            } else if (state.currentTool === 'erase') {
                state.cells[y][x] = 'EMPTY';
                updateStatus(`Erased cell at (${x}, ${y})`);
            } else if (state.currentTool === 'pick') {
                state.selectedTile = state.cells[y][x];
                updateTileSelection();
                updateStatus(`Picked ${state.selectedTile}`);
            }
        }

        // ============================================
        // File Loading
        // ============================================
        function loadAllFiles() {
            const files = {
                map: document.getElementById('mapFile').files[0],
                cells: document.getElementById('cellsFile').files[0],
                tileset: document.getElementById('tilesetFile').files[0],
                tiles: document.getElementById('tilesFile').files[0],
                geometry: document.getElementById('geometryFile').files[0],
                texture: document.getElementById('textureFile').files[0]
            };
            
            const promises = [];
            
            if (files.map) promises.push(loadJSON(files.map, 'map'));
            if (files.cells) promises.push(loadJSON(files.cells, 'cells'));
            if (files.tileset) promises.push(loadJSON(files.tileset, 'tileset'));
            if (files.tiles) promises.push(loadJSON(files.tiles, 'tiles'));
            if (files.geometry) promises.push(loadJSON(files.geometry, 'geometry'));
            if (files.texture) promises.push(loadTexture(files.texture));
            
            Promise.all(promises).then(() => {
                updateUI();
                updateStatus('All files loaded successfully');
            }).catch(err => {
                updateStatus('Error loading files: ' + err.message);
            });
        }

        function loadJSON(file, type) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        state[type] = data;
                        resolve();
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function loadTexture(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        state.textureImage = img;
                        
                        // Create WebGL texture
                        const texture = gl.createTexture();
                        gl.bindTexture(gl.TEXTURE_2D, texture);
                        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                        
                        state.texture = texture;
                        
                        // Update preview
                        updateTexturePreview();
                        
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        // UI Updates
        // ============================================
        function updateUI() {
            updateTileList();
            updateGeometryList();
            updateTextureList();
            if (state.map && state.map.bounds) {
                document.getElementById('mapWidth').value = state.map.bounds[2];
                document.getElementById('mapHeight').value = state.map.bounds[3];
            }
        }

        function updateTileList() {
            const container = document.getElementById('tileList');
            container.innerHTML = '';
            
            for (const tileName in state.tiles) {
                const div = document.createElement('div');
                div.className = 'tile-item';
                if (tileName === state.selectedTile) {
                    div.classList.add('selected');
                }
                div.textContent = tileName;
                div.onclick = () => {
                    state.selectedTile = tileName;
                    updateTileSelection();
                };
                container.appendChild(div);
            }
        }

        function updateTileSelection() {
            const items = document.querySelectorAll('.tile-item');
            items.forEach(item => {
                item.classList.toggle('selected', item.textContent === state.selectedTile);
            });
        }

        function updateGeometryList() {
            const container = document.getElementById('geometryList');
            container.innerHTML = '';
            
            for (const geomName in state.geometry) {
                const div = document.createElement('div');
                div.className = 'geometry-item';
                div.innerHTML = `
                    <span>${geomName}</span>
                    <button class="secondary" onclick="editGeometry('${geomName}')">Edit</button>
                `;
                container.appendChild(div);
            }
        }

        function updateTextureList() {
            const container = document.getElementById('textureList');
            if (!state.tileset || !state.tileset.textures) {
                container.innerHTML = '<div class="info-text">No textures loaded</div>';
                return;
            }
            
            let html = '<div style="font-size: 11px; max-height: 150px; overflow-y: auto;">';
            for (const texName in state.tileset.textures) {
                const coords = state.tileset.textures[texName];
                html += `<div style="padding: 4px; border-bottom: 1px solid #3e3e42;">${texName}: [${coords.join(', ')}]</div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function updateTexturePreview() {
            if (!state.textureImage) return;
            
            const canvas = document.getElementById('texturePreview');
            const ctx = canvas.getContext('2d');
            canvas.width = state.textureImage.width;
            canvas.height = state.textureImage.height;
            ctx.drawImage(state.textureImage, 0, 0);
        }

        function updateStatus(message) {
            document.getElementById('statusBar').textContent = message;
        }

        // ============================================
        // Tools
        // ============================================
        function selectTool(tool) {
            state.currentTool = tool;
            document.querySelectorAll('#toolbar button').forEach(btn => {
                btn.classList.remove('tool-active');
            });
            document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('tool-active');
            updateStatus(`Tool: ${tool}`);
        }

        function resetCamera() {
            camera.position = [8, 15, 20];
            camera.rotation = [-0.5, 0, 0];
            camera.zoom = 1.0;
        }

        function toggleGrid() {
            state.showGrid = !state.showGrid;
        }

        function toggle3DView() {
            state.show3D = document.getElementById('show3D').checked;
        }

        // ============================================
        // Map Editing
        // ============================================
        function resizeMap() {
            const width = parseInt(document.getElementById('mapWidth').value);
            const height = parseInt(document.getElementById('mapHeight').value);
            
            const newCells = [];
            for (let y = 0; y < height; y++) {
                const row = [];
                for (let x = 0; x < width; x++) {
                    if (state.cells[y] && state.cells[y][x]) {
                        row.push(state.cells[y][x]);
                    } else {
                        row.push('EMPTY');
                    }
                }
                newCells.push(row);
            }
            
            state.cells = newCells;
            if (state.map) {
                state.map.bounds = [0, 0, width, height];
            }
            updateStatus(`Map resized to ${width}x${height}`);
        }

        function clearMap() {
            if (!confirm('Clear entire map?')) return;
            
            for (let y = 0; y < state.cells.length; y++) {
                for (let x = 0; x < state.cells[y].length; x++) {
                    state.cells[y][x] = 'EMPTY';
                }
            }
            updateStatus('Map cleared');
        }

        // ============================================
        // Dialogs
        // ============================================
        function showAddTileDialog() {
            const name = prompt('Enter tile name:');
            if (!name) return;
            
            const definition = prompt('Enter tile definition (e.g., FLAT_ALL,FLOOR,0):');
            if (!definition) return;
            
            state.tiles[name] = definition.split(',');
            updateTileList();
            updateStatus(`Added tile: ${name}`);
        }

        function showAddGeometryDialog() {
            const name = prompt('Enter geometry name:');
            if (!name) return;
            
            state.geometry[name] = {
                vertices: [
                    [[0, 1, 0], [1, 1, 0], [1, 0, 0]],
                    [[0, 1, 0], [1, 0, 0], [0, 0, 0]]
                ],
                surfaces: [
                    [[0, 1], [1, 1], [1, 0]],
                    [[0, 1], [1, 0], [0, 0]]
                ],
                type: 15
            };
            updateGeometryList();
            updateStatus(`Added geometry: ${name}`);
        }

        function showAddTextureDialog() {
            const name = prompt('Enter texture name:');
            if (!name) return;
            
            const x = parseInt(prompt('Enter X coordinate:') || '0');
            const y = parseInt(prompt('Enter Y coordinate:') || '0');
            
            if (!state.tileset) {
                state.tileset = { textures: {} };
            }
            if (!state.tileset.textures) {
                state.tileset.textures = {};
            }
            
            state.tileset.textures[name] = [x, y];
            updateTextureList();
            updateStatus(`Added texture: ${name}`);
        }

        function editGeometry(name) {
            alert('Geometry editor coming soon!\n\nCurrent geometry: ' + name);
        }

        function closeCellEditor() {
            document.getElementById('cellEditor').style.display = 'none';
        }

        function applyCellEdit() {
            const tileType = document.getElementById('cellTileType').value;
            if (state.editingCell) {
                state.cells[state.editingCell.y][state.editingCell.x] = tileType;
            }
            closeCellEditor();
        }

        // ============================================
        // Export
        // ============================================
        function exportMap() {
            if (!state.map) {
                alert('No map data to export');
                return;
            }
            downloadJSON(state.map, 'map.json');
        }

        function exportCells() {
            if (!state.cells || state.cells.length === 0) {
                alert('No cells data to export');
                return;
            }
            downloadJSON(state.cells, 'cells.json');
        }

        function exportTileset() {
            if (!state.tileset) {
                alert('No tileset data to export');
                return;
            }
            downloadJSON(state.tileset, 'tileset.json');
        }

        function exportTiles() {
            if (!state.tiles || Object.keys(state.tiles).length === 0) {
                alert('No tiles data to export');
                return;
            }
            downloadJSON(state.tiles, 'tiles.json');
        }

        function exportGeometry() {
            if (!state.geometry || Object.keys(state.geometry).length === 0) {
                alert('No geometry data to export');
                return;
            }
            downloadJSON(state.geometry, 'geometry.json');
        }

        function exportAll() {
            exportMap();
            exportCells();
            exportTileset();
            exportTiles();
            exportGeometry();
        }

        function downloadJSON(data, filename) {
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            updateStatus(`Exported ${filename}`);
        }

        // ============================================
        // UI Helpers
        // ============================================
        function toggleSection(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('span:last-child');
            content.classList.toggle('collapsed');
            arrow.textContent = content.classList.contains('collapsed') ? '▶' : '▼';
        }

        // ============================================
        // Initialize
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            initWebGL();
            
            // Initialize with empty map
            state.cells = [];
            for (let y = 0; y < 19; y++) {
                const row = [];
                for (let x = 0; x < 17; x++) {
                    row.push('EMPTY');
                }
                state.cells.push(row);
            }
            
            updateStatus('Ready - Load files to begin editing');
        });
    </script>
</body>
