<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Ultimate Vanilla WebGL 2.0 OBJ + MTL + Textures Viewer (Video Game Ready)</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #drop_zone {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.4s;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
      text-align: center;
      font-size: 1.4em;
    }

    #drop_zone.ready {
      opacity: 0;
      pointer-events: none;
    }

    #file_button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      pointer-events: auto;
      display: inline-block;
    }

    #file_button:hover {
      background: #555;
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>
  <div id="drop_zone">Drop your .obj + .mtl + texture files (.png/.jpg) here<br><small>Supports full MTL
      (Kd/Ka/Ks/Ns/map_Kd), UVs, correct normals or auto-generated</small><br><label for="file_input"
      id="file_button">Choose Files</label><input type="file" id="file_input" multiple
      accept=".obj,.mtl,.png,.jpg,.jpeg" style="display: none;"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const dropZone = document.getElementById('drop_zone');
    const gl = canvas.getContext('webgl2');

    if (!gl) {
      alert('WebGL 2.0 not supported');
    }

    // === Minimal vec3 helpers ===
    const vec3 = {};
    vec3.sub = (a, b, out = [0, 0, 0]) => { out[0] = a[0] - b[0]; out[1] = a[1] - b[1]; out[2] = a[2] - b[2]; return out; };
    vec3.cross = (a, b, out = [0, 0, 0]) => {
      const ax = a[0], ay = a[1], az = a[2];
      const bx = b[0], by = b[1], bz = b[2];
      out[0] = ay * bz - az * by;
      out[1] = az * bx - ax * bz;
      out[2] = ax * by - ay * bx;
      return out;
    };
    vec3.dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    vec3.length = v => Math.hypot(v[0], v[1], v[2]);
    vec3.normalize = (v, out = [0, 0, 0]) => {
      const len = vec3.length(v);
      if (len === 0) return out;
      out[0] = v[0] / len; out[1] = v[1] / len; out[2] = v[2] / len;
      return out;
    };

    // === Perspective matrix (column-major) ===
    function perspective(fovyRad, aspect, near, far) {
      const f = 1.0 / Math.tan(fovyRad / 2);
      const d = far - near;
      const out = new Float32Array(16);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = (near + far) / d;
      out[11] = -1;
      out[14] = 2 * near * far / d;
      out[15] = 0;
      return out;
    }

    // === LookAt matrix (column-major) ===
    function lookAt(eye, center, up) {
      const f = [0, 0, 0];
      vec3.sub(center, eye, f);
      const fmag = vec3.length(f);
      if (fmag === 0) { f[2] = -1; } else { f[0] /= fmag; f[1] /= fmag; f[2] /= fmag; }

      const s = [0, 0, 0];
      vec3.cross(up, f, s);
      const smag = vec3.length(s);
      if (smag === 0) { s[0] = 1; } else { s[0] /= smag; s[1] /= smag; s[2] /= smag; }

      const u = [0, 0, 0];
      vec3.cross(f, s, u);

      const out = new Float32Array(16);
      out[0] = s[0]; out[1] = u[0]; out[2] = -f[0]; out[3] = 0;
      out[4] = s[1]; out[5] = u[1]; out[6] = -f[1]; out[7] = 0;
      out[8] = s[2]; out[9] = u[2]; out[10] = -f[2]; out[11] = 0;
      out[12] = -vec3.dot(s, eye);
      out[13] = -vec3.dot(u, eye);
      out[14] = vec3.dot(f, eye);
      out[15] = 1;
      return out;
    }

    // === Shaders ===
    const vsSource = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 a_position;
    layout(location=1) in vec3 a_normal;
    layout(location=2) in vec2 a_uv;

    uniform mat4 u_projection;
    uniform mat4 u_view;

    out vec3 v_position;
    out vec3 v_normal;
    out vec2 v_uv;

    void main() {
      v_position = a_position;
      v_normal = a_normal;
      v_uv = a_uv;
      gl_Position = u_projection * u_view * vec4(a_position, 1.0);
    }
    `;

    const fsSource = `#version 300 es
    precision highp float;

    in vec3 v_position;
    in vec3 v_normal;
    in vec2 v_uv;

    uniform vec3 u_cameraPos;
    uniform vec3 u_lightDir;   // normalized direction TO light
    uniform vec3 u_lightColor;
    uniform vec3 u_ambientLight;

    uniform vec3 u_Ka;
    uniform vec3 u_Kd;
    uniform vec3 u_Ks;
    uniform float u_Ns;

    uniform sampler2D u_mapKd;
    uniform bool u_hasMapKd;

    out vec4 outColor;

    void main() {
      vec3 albedo = u_Kd;
      if (u_hasMapKd) albedo *= texture(u_mapKd, v_uv).rgb;

      vec3 N = normalize(v_normal);
      vec3 L = u_lightDir;
      vec3 V = normalize(u_cameraPos - v_position);

      float diffuseFactor = max(dot(N, L), 0.0);

      vec3 H = normalize(L + V);
      float specularFactor = pow(max(dot(N, H), 0.0), u_Ns + 0.001); // +0.001 avoids pow(0,0)

      vec3 ambient = u_Ka * u_ambientLight;
      vec3 diffuse = albedo * u_lightColor * diffuseFactor;
      vec3 specular = u_Ks * u_lightColor * specularFactor;

      outColor = vec4(ambient + diffuse + specular, 1.0);
    }
  `;

    // === Compile program ===
    function createShader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const loc = {
      proj: gl.getUniformLocation(program, 'u_projection'),
      view: gl.getUniformLocation(program, 'u_view'),
      cameraPos: gl.getUniformLocation(program, 'u_cameraPos'),
      lightDir: gl.getUniformLocation(program, 'u_lightDir'),
      lightColor: gl.getUniformLocation(program, 'u_lightColor'),
      ambientLight: gl.getUniformLocation(program, 'u_ambientLight'),
      Ka: gl.getUniformLocation(program, 'u_Ka'),
      Kd: gl.getUniformLocation(program, 'u_Kd'),
      Ks: gl.getUniformLocation(program, 'u_Ks'),
      Ns: gl.getUniformLocation(program, 'u_Ns'),
      mapKd: gl.getUniformLocation(program, 'u_mapKd'),
      hasMapKd: gl.getUniformLocation(program, 'u_hasMapKd'),
    };

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.clearColor(0.08, 0.08, 0.12, 1.0);

    let meshes = [];
    let center = [0, 0, 0];
    let boundingRadius = 1;
    let cameraDistance = 5;
    let theta = 0.0;   // azimuth
    let phi = 0.2;    // elevation

    const projectionMatrix = perspective(45 * Math.PI / 180, canvas.clientWidth / canvas.clientHeight, 0.01, 10000);
    let viewMatrix = new Float32Array(16);
    const cameraPos = [0, 0, 5];
    const upVec = [0, 1, 0];

    // Light (directional, world space)
    const lightDir = vec3.normalize([0.4, 1.0, 0.7]);

    // === File loading ===
    let objFile = null, mtlFile = null;
    const textures = {};
    let loadedImages = 0, totalImages = 0;
    let objText = null, mtlText = null;

    function isPowerOf2(v) { return (v & (v - 1)) === 0 && v > 0; }

    const fileInput = document.getElementById('file_input');

    function processFiles(files) {
      objFile = files.find(f => f.name.toLowerCase().endsWith('.obj')) || null;
      mtlFile = files.find(f => f.name.toLowerCase().endsWith('.mtl')) || null;
      const imageFiles = files.filter(f => /\.(png|jpg|jpeg)$/i.test(f.name));

      if (!objFile) {
        alert('No .obj file found');
        return;
      }

      totalImages = imageFiles.length;

      // Load textures first
      imageFiles.forEach(file => {
        console.log('Loading texture:', file.name);
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          console.log('Texture loaded:', file.name, img.width, 'x', img.height);
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);

          if (isPowerOf2(img.width) && isPowerOf2(img.height)) {
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          } else {
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          }
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

          textures[file.name] = tex;
          loadedImages++;
          console.log('Textures loaded:', loadedImages, '/', totalImages);
          checkReady();
        };
        img.onerror = () => console.error('Failed to load texture:', file.name);
        img.src = url;
      });

      // Load OBJ
      const objReader = new FileReader();
      objReader.onload = () => {
        objText = objReader.result;
        checkReady();
      };
      objReader.readAsText(objFile);

      // Load MTL if present
      let mtlText = null;
      if (mtlFile) {
        const mtlReader = new FileReader();
        mtlReader.onload = () => {
          mtlText = mtlReader.result;
          checkReady();
        };
        mtlReader.readAsText(mtlFile);
      } else {
        checkReady();
      }

      function checkReady() {
        if (objText !== null && (mtlFile === null || mtlText !== null) && loadedImages === totalImages) {
          processScene(objText, mtlText);
          dropZone.classList.add('ready');
        }
      }
    }

    dropZone.addEventListener('dragover', e => e.preventDefault());
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.background = 'rgba(0,100,0,0.3)';

      const files = Array.from(e.dataTransfer.files);
      processFiles(files);
    });

    fileInput.addEventListener('change', e => {
      const files = Array.from(e.target.files);
      processFiles(files);
    });

    // === OBJ / MTL parsing ===
    function parseOBJ(text) {
      const lines = text.split(/\r?\n/);

      const positions = [];
      const uvs = [];
      const normals = [];

      const meshes = [];
      let currentMesh = { positions: [], uvs: [], normals: [], material: 'default' };
      let currentMaterial = 'default';
      let mtllibName = null;

      for (let line of lines) {
        line = line.trim();
        if (!line || line[0] === '#') continue;
        const parts = line.split(/\s+/);

        if (parts[0] === 'v') {
          positions.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3]));
        } else if (parts[0] === 'vt') {
          uvs.push(parseFloat(parts[1]), 1.0 - parseFloat(parts[2])); // flip V for WebGL
        } else if (parts[0] === 'vn') {
          normals.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3]));
        } else if (parts[0] === 'f') {
          const faceVerts = parts.slice(1).map(v => {
            const idx = v.split('/');
            return {
              v: idx[0] ? parseInt(idx[0]) : null,
              vt: idx[1] && idx[1] !== '' ? parseInt(idx[1]) : null,
              vn: idx[2] && idx[2] !== '' ? parseInt(idx[2]) : null,
            };
          });

          // triangulate fan
          for (let i = 1; i < faceVerts.length - 1; i++) {
            const fv = [faceVerts[0], faceVerts[i], faceVerts[i + 1]];

            const triPos = fv.map(f => {
              if (!f.v) return [0, 0, 0];
              const i = f.v > 0 ? f.v - 1 : positions.length / 3 + f.v;
              const off = i * 3;
              return [positions[off], positions[off + 1], positions[off + 2]];
            });

            const triUv = fv.map(f => {
              if (!f.vt) return [0, 0];
              const i = f.vt > 0 ? f.vt - 1 : uvs.length / 2 + f.vt;
              const off = i * 2;
              // Clamp UV coordinates to 0-1 range and ensure valid indices
              const u = Math.max(0, Math.min(1, uvs[off] || 0));
              const v = Math.max(0, Math.min(1, uvs[off + 1] || 0));
              return [u, v];
            });

            const useFaceNormal = fv[0].vn == null && fv[1].vn == null && fv[2].vn == null;

            let faceNormal = [0, 0, 0];
            if (useFaceNormal) {
              const e1 = vec3.sub(triPos[1], triPos[0]);
              const e2 = vec3.sub(triPos[2], triPos[0]);
              vec3.cross(e1, e2, faceNormal);
              vec3.normalize(faceNormal, faceNormal);
            }

            for (let k = 0; k < 3; k++) {
              // position
              currentMesh.positions.push(triPos[k][0], triPos[k][1], triPos[k][2]);
              // uv
              currentMesh.uvs.push(triUv[k][0], triUv[k][1]);

              // normal
              if (fv[k].vn != null) {
                const i = fv[k].vn > 0 ? fv[k].vn - 1 : normals.length / 3 + fv[k].vn;
                const off = i * 3;
                currentMesh.normals.push(normals[off], normals[off + 1], normals[off + 2]);
              } else {
                currentMesh.normals.push(faceNormal[0], faceNormal[1], faceNormal[2]);
              }
            }
          }
        } else if (parts[0] === 'usemtl') {
          if (currentMesh.positions.length > 0) meshes.push(currentMesh);
          currentMaterial = parts[1];
          currentMesh = { positions: [], uvs: [], normals: [], material: currentMaterial };
        } else if (parts[0] === 'mtllib') {
          mtllibName = parts.slice(1).join(' ');
        }
      }

      if (currentMesh.positions.length > 0) meshes.push(currentMesh);

      return { meshes, mtllibName };
    }

    function parseMTL(text) {
      const materials = {};
      let current = null;
      const lines = text.split(/\r?\n/);

      console.log('Parsing MTL...');

      for (let line of lines) {
        line = line.trim();
        if (!line || line[0] === '#') continue;
        const parts = line.split(/\s+/);

        if (parts[0] === 'newmtl') {
          current = parts[1];
          materials[current] = { Ka: [1, 1, 1], Kd: [0.8, 0.8, 0.8], Ks: [1, 1, 1], Ns: 50 };
          console.log('New material:', current);
        } else if (current) {
          if (parts[0] === 'Ka' || parts[0] === 'Kd' || parts[0] === 'Ks') {
            const vals = parts.slice(1).map(parseFloat);
            materials[current][parts[0]] = vals.length === 1 ? [vals[0], vals[0], vals[0]] : vals;
            console.log('Material', current, parts[0] + ':', materials[current][parts[0]]);
          } else if (parts[0] === 'Ns') {
            materials[current].Ns = parseFloat(parts[1]);
            console.log('Material', current, 'Ns:', materials[current].Ns);
          } else if (parts[0] === 'map_Kd') {
            materials[current].map_Kd = parts.slice(1).join(' ');
            console.log('Material', current, 'map_Kd:', materials[current].map_Kd);
          }
        }
      }
      console.log('Parsed materials:', materials);
      return materials;
    }

    // === Scene setup ===
    function processScene(objText, mtlText) {
      const { meshes: parsedMeshes, mtllibName } = parseOBJ(objText);

      const materials = mtlText ? parseMTL(mtlText) : {};

      // assign materials
      parsedMeshes.forEach(m => {
        m.mat = materials[m.material] || { Ka: [0.25, 0.25, 0.3], Kd: [0.75, 0.75, 0.75], Ks: [1, 1, 1], Ns: 50 };

        // More robust texture matching
        let texture = null;
        if (m.mat.map_Kd) {
          // Extract filename from path
          const textureFileName = m.mat.map_Kd.split('/').pop();
          // Try exact match first
          texture = textures[textureFileName];
          if (!texture) {
            // Try case-insensitive match
            const textureNameLower = textureFileName.toLowerCase();
            for (const [fileName, tex] of Object.entries(textures)) {
              if (fileName.toLowerCase() === textureNameLower) {
                texture = tex;
                break;
              }
            }
          }
          if (!texture) {
            // Try filename without extension
            const baseName = textureFileName.split('.')[0].toLowerCase();
            for (const [fileName, tex] of Object.entries(textures)) {
              if (fileName.split('.')[0].toLowerCase() === baseName) {
                texture = tex;
                break;
              }
            }
          }
        }

        m.texture = texture;
        m.hasTexture = !!texture;
        console.log('Mesh material:', m.material, 'Texture found:', !!texture, 'map_Kd:', m.mat.map_Kd);
      });

      // compute bounding sphere
      let min = [Infinity, Infinity, Infinity];
      let max = [-Infinity, -Infinity, -Infinity];
      parsedMeshes.forEach(m => {
        for (let i = 0; i < m.positions.length; i += 3) {
          min[0] = Math.min(min[0], m.positions[i]);
          min[1] = Math.min(min[1], m.positions[i + 1]);
          min[2] = Math.min(min[2], m.positions[i + 2]);
          max[0] = Math.max(max[0], m.positions[i]);
          max[1] = Math.max(max[1], m.positions[i + 1]);
          max[2] = Math.max(max[2], m.positions[i + 2]);
        }
      });

      center = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
      boundingRadius = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2;
      cameraDistance = boundingRadius * 3 || 5;

      // create VAOs
      parsedMeshes.forEach(m => {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        // positions
        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.positions), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

        // normals
        const normBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.normals), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

        // uvs
        const uvBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.uvs), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);

        m.vao = vao;
        m.count = m.positions.length / 3;
      });

      meshes = parsedMeshes;
      requestAnimationFrame(render);
    }

    // === Camera controls ===
    let isMouseDown = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) {
        isMouseDown = true;
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    window.addEventListener('mousemove', e => {
      if (isMouseDown) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        theta -= dx * 0.005;
        phi -= dy * 0.005;
        phi = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, phi));
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => isMouseDown = false);
    canvas.addEventListener('wheel', e => {
      cameraDistance += e.deltaY * 0.001 * cameraDistance;
      cameraDistance = Math.max(boundingRadius * 0.5, Math.min(boundingRadius * 20, cameraDistance));
      e.preventDefault();
    });

    function updateCamera() {
      const cosPhi = Math.cos(phi);
      cameraPos[0] = center[0] + cameraDistance * Math.sin(theta) * cosPhi;
      cameraPos[1] = center[1] + cameraDistance * Math.sin(phi);
      cameraPos[2] = center[2] + cameraDistance * Math.cos(theta) * cosPhi;
      viewMatrix = lookAt(cameraPos, center, upVec);
    }

    // === Render loop ===
    function render() {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      updateCamera();

      gl.uniformMatrix4fv(loc.proj, false, projectionMatrix);
      gl.uniformMatrix4fv(loc.view, false, viewMatrix);
      gl.uniform3fv(loc.cameraPos, cameraPos);
      gl.uniform3fv(loc.lightDir, lightDir);
      gl.uniform3fv(loc.lightColor, [1, 1, 1]);
      gl.uniform3fv(loc.ambientLight, [0.25, 0.25, 0.3]);

      meshes.forEach(m => {
        gl.bindVertexArray(m.vao);

        if (m.hasTexture) {
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, m.texture);
          gl.uniform1i(loc.mapKd, 0);
          gl.uniform1i(loc.hasMapKd, true);
        } else {
          gl.uniform1i(loc.hasMapKd, false);
        }

        const mat = m.mat;
        gl.uniform3fv(loc.Ka, mat.Ka);
        gl.uniform3fv(loc.Kd, mat.Kd);
        gl.uniform3fv(loc.Ks, mat.Ks);
        gl.uniform1f(loc.Ns, mat.Ns);

        gl.drawArrays(gl.TRIANGLES, 0, m.count);
      });

      requestAnimationFrame(render);
    }

    // Initial resize
    window.addEventListener('resize', () => {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      Object.assign(projectionMatrix, perspective(45 * Math.PI / 180, canvas.clientWidth / canvas.clientHeight, 0.01, 10000));
    });
  </script>
</body>

</html>
